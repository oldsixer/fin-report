<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核心命题与语义契约</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../shared/deck.css">
</head>
<body>
  <header class="masthead"><p>TCEG METHOD</p><p class="section">Why · Semantic Contract</p></header>
  <main class="slide">
    <p class="kicker">Research thesis</p>
    <p class="statement">研报不是主要状态。<em>图才是主要状态</em>；研报只是图在当前时点的一种语言呈现。</p>
    <section class="contract-grid" aria-label="TCEG 语义契约">
      <article class="contract-item">
        <h3>FACT</h3>
        <p>公司、产品、事件和可核验陈述必须保留来源。</p>
      </article>
      <article class="contract-item">
        <h3>NUMBER</h3>
        <p>数值同时记录指标、期间、单位、币种与尺度。</p>
      </article>
      <article class="contract-item">
        <h3>ARGUMENT</h3>
        <p>前提、推理步骤和结论形成可遍历的论证路径。</p>
      </article>
      <article class="contract-item">
        <h3>EVIDENCE</h3>
        <p>每个语义对象都能回到报告页、source object 与原文片段。</p>
      </article>
    </section>
    <div class="source-note"><p>设计目标：保存“本质信息”，不保存报告的逐字语言外壳。</p><p class="mono">CANONICAL STATE ≠ TEXT RECONSTRUCTION</p></div>
  </main>
</body>
</html>
